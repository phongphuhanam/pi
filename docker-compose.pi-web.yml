services:
  pi-web-sessiond:
    build:
      context: ./docker
      dockerfile: Dockerfile.pi-web
      args:
        APT_PROXY: http://host.docker.internal:3142
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: pi-web-sandbox:ollama
    container_name: pi-web-sessiond
    restart: unless-stopped
    working_dir: /workspace
    environment:
      PI_WEB_DATA_DIR: /home/node/.pi-web
    volumes:
      - .:/workspace
      # Same agent home the plain pi sandbox uses (docker-compose.pi.yml),
      # so pi-web's sessions see the same Ollama provider config for free.
      - ./docker/pi-agent-home:/home/node/.pi/agent
      # Shared with pi-web-server below: the unix socket sessiond listens on
      # lives here (PI_WEB_DATA_DIR/sessiond.sock). No network port needed
      # between the two -- both containers just need this same path mounted.
      - pi-web-data:/home/node/.pi-web
      - ~/.ssh:/home/node/.ssh
    command: ["pi-web-sessiond"]

  pi-web-server:
    image: pi-web-sandbox:ollama
    container_name: pi-web-server
    restart: unless-stopped
    depends_on:
      - pi-web-sessiond
    # Unlike dsh (which hard-refuses --host 0.0.0.0 and therefore needs
    # network_mode: host + loopback to be reachable at all), pi-web has no
    # such restriction, so it follows this repo's own established pattern
    # instead (see docker-compose.vaultwarden.yml): a dedicated bridge
    # network with a static IP, no host networking needed. nginx (running
    # with network_mode: host) reaches this IP directly through the bridge
    # interface Docker sets up on the host -- the same way it already
    # reaches vaultwarden at 172.31.0.2. Binding 0.0.0.0 here only means
    # "every interface inside this container's own network namespace";
    # nothing publishes a host port, so it's still unreachable from
    # anywhere but this bridge network (i.e. nginx).
    networks:
      pi-web-net:
        ipv4_address: 172.24.0.2
    environment:
      PI_WEB_HOST: 0.0.0.0
      PI_WEB_PORT: "8504"
      PI_WEB_DATA_DIR: /home/node/.pi-web
    volumes:
      - pi-web-data:/home/node/.pi-web
    # Wait for sessiond's socket before starting -- simpler than a Compose
    # health-check dependency for a two-service, single-host pair.
    command: >
      bash -c '
        until [ -S /home/node/.pi-web/sessiond.sock ]; do sleep 0.5; done
        exec pi-web-server
      '

volumes:
  pi-web-data:

networks:
  pi-web-net:
    ipam:
      config:
        - subnet: 172.24.0.0/24
